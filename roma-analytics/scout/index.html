<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120c0d">
<title>Roma Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c0d;--bg2:#1c1415;--card:#1e1617;--card2:#271d1f;--line:#352a2c;--ink:#f6f0e8;--mute:#a5988c;--red:#8E1F2F;--red2:#b52a40;--gold:#F0BC42;--ucl:#3d5bd9;--coppa:#2f9a6a;--W:#3fae6a;--D:#8c8178;--L:#e0503f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.H{font-family:Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(18,12,13,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.top .wrap{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--gold) 0 40%,var(--red2) 40% 100%);display:grid;place-items:center;font:700 14px Oswald,sans-serif;color:#fff}
.brand b{font:700 19px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--mute);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:99px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--W);box-shadow:0 0 8px var(--W)}.dot.off{background:var(--gold)}.dot.live{background:var(--L);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* tabs */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(18,12,13,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mute);padding:4px 0;letter-spacing:.03em}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--gold)}
.view{display:none;padding-top:14px}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.sec{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.sec a{color:var(--gold);text-decoration:none;letter-spacing:.06em;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;background:radial-gradient(130% 90% at 100% 0%,rgba(240,188,66,.22),transparent 55%),linear-gradient(150deg,#7a1a29,#3a0e16 70%);border:1px solid rgba(240,188,66,.25);cursor:pointer}
.hero .lbl{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;display:flex;gap:8px;align-items:center}
.hero .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:16px 0 12px;text-align:center}
.hero .teams .nm{font:700 15px Oswald,sans-serif;text-transform:uppercase;margin-top:8px;letter-spacing:.02em}
.hero .v{font:700 26px Oswald,sans-serif;color:rgba(255,255,255,.55)}
.hero .score{font:700 44px Oswald,sans-serif}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{background:rgba(0,0,0,.28);border-radius:12px;padding:8px 0;text-align:center}
.cd b{display:block;font:700 24px Oswald,sans-serif;font-variant-numeric:tabular-nums}
.cd span{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.6);text-transform:uppercase}
.when{text-align:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.75);margin-bottom:12px}
.mono{border-radius:50%;display:grid;place-items:center;font:700 Oswald,sans-serif;font-family:Oswald,Impact,sans-serif;color:#fff;position:relative;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
.p-SA{background:rgba(240,188,66,.15);color:var(--gold)}.p-UCL{background:rgba(61,91,217,.22);color:#9db0ff}.p-CI{background:rgba(47,154,106,.2);color:#7fe0b2}
.p-H{background:var(--gold);color:#2a1d00}.p-A{background:var(--card2);color:var(--mute)}
.p-live{background:var(--L);color:#fff}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.tile b{display:block;font:700 26px Oswald,sans-serif;color:var(--ink);line-height:1}
.tile b.g{color:var(--gold)}
.tile span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-top:6px}
.form{display:flex;gap:6px}
.fchip{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 16px Oswald,sans-serif;color:#fff}
.W{background:var(--W)}.D{background:var(--D)}.L{background:var(--L)}.N{background:var(--card2);color:var(--mute)}
/* strip */
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.sc{flex:none;width:118px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center}
.sc .d{font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.sc .o{font:700 14px Oswald,sans-serif;text-transform:uppercase;line-height:1.05}
.thr{display:flex;gap:3px}.thr i{width:12px;height:5px;border-radius:2px;background:var(--line)}.thr i.on{background:var(--red2)}
/* season list */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.filters button{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.month{font:700 13px Oswald,sans-serif;letter-spacing:.12em;color:var(--mute);margin:20px 4px 8px;text-transform:uppercase}
.row{display:grid;grid-template-columns:44px 40px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.row.c-SA::before{background:var(--gold)}.row.c-UCL::before{background:var(--ucl)}.row.c-CI::before{background:var(--coppa)}
.row.next{border-color:rgba(240,188,66,.6);box-shadow:0 0 0 1px rgba(240,188,66,.25)}
.row .dt{text-align:center;line-height:1}.row .dt b{display:block;font:700 22px Oswald,sans-serif}.row .dt span{font-size:10px;font-weight:800;color:var(--mute);letter-spacing:.06em}
.row .nm{font-weight:800;font-size:15px;line-height:1.15}.row .nm small{display:block;font-size:11.5px;font-weight:600;color:var(--mute);margin-top:3px}
.res{min-width:58px;text-align:center;border-radius:10px;padding:6px 8px;font:700 17px Oswald,sans-serif;color:#fff}
.chart{width:100%;height:auto;display:block}
.prog{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--gold));border-radius:99px}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10px;letter-spacing:.1em;color:var(--mute);font-weight:800;text-align:center;padding:6px 2px;text-transform:uppercase}
.tbl td{padding:9px 2px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.tm{text-align:left;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tbl td.pts{font:700 16px Oswald,sans-serif}
.tbl tr.me td{background:rgba(142,31,47,.35)}
.tbl tr.cl td:first-child{box-shadow:inset 3px 0 var(--ucl)}.tbl tr.el td:first-child{box-shadow:inset 3px 0 #e88b2a}.tbl tr.rel td:first-child{box-shadow:inset 3px 0 var(--L)}
.tbl tr{cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px}
.empty b{display:block;font:700 22px Oswald,sans-serif;color:var(--ink);text-transform:uppercase;margin-bottom:6px}
/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center}
.gc .o{font:700 13px Oswald,sans-serif;text-transform:uppercase;line-height:1.05}
.gc small{font-size:10.5px;color:var(--mute);font-weight:700}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:40px}
.sheet.on{transform:none}
.sh-top{position:sticky;top:0;z-index:2;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.sh-top .wrap{display:flex;justify-content:space-between;align-items:center}
.close{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.dhero{border-radius:24px;padding:20px 18px;position:relative;overflow:hidden;border:1px solid var(--line)}
.dhero .row2{display:flex;align-items:center;gap:16px}
.dhero h2{font:700 clamp(30px,9vw,44px) Oswald,sans-serif;text-transform:uppercase;line-height:.95}
.meter{display:flex;gap:4px;margin-top:6px}.meter i{flex:1;height:8px;border-radius:3px;background:rgba(255,255,255,.12)}.meter i.on{background:var(--gold)}
.keys{display:grid;gap:8px}
.key{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.key .n{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--red2),var(--red));display:grid;place-items:center;font:700 18px Oswald,sans-serif;flex:none}
.key b{font-size:15px}
.pitchbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;justify-content:center}
.pitchbox svg{width:100%;max-width:340px;height:auto}
.legend{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:var(--mute);font-weight:700;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.plist span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700}
textarea,input.sc-in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:inherit;font-size:14.5px;padding:12px;min-height:110px;resize:vertical}
.scorebox{display:flex;gap:10px;align-items:center;justify-content:center}
.scorebox input{width:64px;height:56px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);font:700 28px Oswald,sans-serif}
.btn{background:var(--gold);color:#2a1d00;font-weight:800;border-radius:12px;padding:12px 16px;font-size:14px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.note{font-size:11.5px;color:var(--mute);margin-top:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;padding:10px 16px;border-radius:99px;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lastSun(y,m){const d=new Date(Date.UTC(y,m+1,0));d.setUTCDate(d.getUTCDate()-d.getUTCDay());return d}
function romeISO(date,time){ // Rome wall time -> UTC ISO
  const [y,m,d]=date.split("-").map(Number);const [hh,mm]=(time||"15:00").split(":").map(Number);
  const t=Date.UTC(y,m-1,d,hh,mm);const s=lastSun(y,2).getTime()+3600e3,e=lastSun(y,9).getTime()+3600e3;
  return new Date(t-((t>=s&&t<e)?2:1)*3600e3).toISOString();
}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\b(as|ac|fc|ss|ssc|us|cfc|calcio|1907|1913)\b/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
function keyFor(name){
  const n=norm(name);
  for(const [k,t] of Object.entries(T)){ if(norm(t.n)===n||(t.al||[]).some(a=>norm(a)===n)) return k }
  for(const [k,t] of Object.entries(T)){ if(n.includes(norm(t.n))||norm(t.n).includes(n)) return k }
  const k="x_"+n.replace(/ /g,"_"); if(!T[k]) T[k]={n:name,c:["#555","#999"],coach:"",shape:"",th:3}; return k;
}
function mono(k,size=40){const t=T[k]||{n:"?",c:["#555","#999"]};const ini=t.n.replace(/[^A-Za-zÀ-ÿ ]/g,"").split(" ").filter(Boolean).map(w=>w[0]).join("").slice(0,3).toUpperCase()||t.n.slice(0,2);
  const txt=t.dark?"#111":"#fff";
  return `<div class="mono" style="width:${size}px;height:${size}px;font-size:${Math.round(size*(ini.length>2?.3:.38))}px;color:${txt};background:linear-gradient(135deg,${t.c[0]} 0 58%,${t.c[1]} 58%)">${ini}</div>`}
const thr=n=>`<div class="thr">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`;

const fmtD=(iso,o)=>new Date(iso).toLocaleDateString(undefined,o);
const fmtT=iso=>new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
function outcome(r){if(!r)return null;return r[0]>r[1]?"W":r[0]<r[1]?"L":"D"}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800)}

let FX=[]; let TABLE=store.get("table",null); let SYNC=store.get("sync",null); let LIVE=false;
function baseFixtures(){
  const out=[];
  SA.forEach((f,i)=>out.push({id:"SA"+(i+1),comp:"SA",md:i+1,k:f[0],ha:f[1],iso:romeISO(f[2],f[3]),tbc:!f[3],res:f[4]||null,state:f[4]?"post":"pre"}));
  UCL.forEach((f,i)=>out.push({id:"UCL"+(i+1),comp:"UCL",md:i+1,k:f[0],ha:f[1],iso:romeISO(f[2],f[3]),tbc:!f[3],res:f[4]||null,state:f[4]?"post":"pre"}));
  return out;
}
function loadFixtures(){
  FX=baseFixtures();

  applyManual();

}
function applyManual(){const m=store.get("manual",{});FX.forEach(f=>{if(m[f.id]&&f.src!=="live"){f.res=m[f.id];f.state="post";f.manual=true}})}

const API="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const LEAGUES=[["ita.1","SA"],["uefa.champions","UCL"],["ita.coppa_italia","CI"]];
const scoreOf=c=>{const s=c?.score;if(s==null)return null;const v=typeof s==="object"?(s.value??s.displayValue):s;const n=parseFloat(v);return isNaN(n)?null:n};
function parseEvents(json,comp){
  const evs=json?.events||[];const out=[];
  evs.forEach(e=>{
    const c=e.competitions?.[0];if(!c)return;const cs=c.competitors||[];
    const me=cs.find(x=>String(x.team?.id||x.id)===ROMA_ESPN_ID)||cs.find(x=>norm(x.team?.displayName).includes("roma"));
    const op=cs.find(x=>x!==me);if(!me||!op)return;
    const st=(c.status||e.status)?.type||{};
    const state=st.state||(st.completed?"post":"pre");
    const a=scoreOf(me),b=scoreOf(op);
    out.push({comp,iso:new Date(e.date).toISOString(),opp:op.team?.displayName||op.team?.name,oid:String(op.team?.id||""),ha:me.homeAway==="home"?"H":"A",
      state,res:(state!=="pre"&&a!=null&&b!=null)?[a,b]:null,clock:st.shortDetail||st.detail||""});
  });
  return out;
}
function mergeEvents(list,fresh=true){
  list.forEach(ev=>{
    const k=keyFor(ev.opp); if(ev.oid) T[k].espn=ev.oid;
    let f=FX.find(x=>x.comp===ev.comp&&x.k===k&&x.ha===ev.ha&&Math.abs(new Date(x.iso)-new Date(ev.iso))<20*864e5);
    if(!f){f={id:ev.comp+"_"+ev.iso.slice(0,10)+"_"+k,comp:ev.comp,k,ha:ev.ha};FX.push(f)}
    f.iso=ev.iso;f.tbc=false;f.state=ev.state;f.clock=ev.clock;if(ev.res){f.res=ev.res;f.manual=false}f.src="live";
  });
}
async function getJSON(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function refresh(manual){
  const ico=$("#syncIco");ico.classList.add("spin");
  let ok=0,all=[];
  await Promise.all(LEAGUES.map(async([lg,comp])=>{
    for(const q of ["","?fixture=true"]){
      try{const j=await getJSON(`${API}${lg}/teams/${ROMA_ESPN_ID}/schedule${q}`);all.push(...parseEvents(j,comp));ok++}catch(e){}
    }
  }));
  try{
    const j=await getJSON("https://site.api.espn.com/apis/v2/sports/soccer/ita.1/standings");
    const ent=(j.children?.[0]?.standings?.entries)||(j.standings?.entries)||[];
    if(ent.length){
      TABLE={at:Date.now(),rows:ent.map(e=>{const s={};(e.stats||[]).forEach(x=>s[x.name||x.type]=x.value);const k=keyFor(e.team?.displayName||e.team?.name);T[k].espn=String(e.team?.id||T[k].espn||"");
        return{k,r:s.rank,p:s.gamesPlayed,w:s.wins,d:s.ties,l:s.losses,gf:s.pointsFor,ga:s.pointsAgainst,gd:s.pointDifferential,pts:s.points}}).sort((a,b)=>(a.r||99)-(b.r||99))};
      store.set("table",TABLE);ok++;
    }
  }catch(e){}
  if(all.length){store.set("fx",all);loadFixtures();}
  if(ok){SYNC=Date.now();store.set("sync",SYNC);store.set("espnIds",Object.fromEntries(Object.entries(T).filter(([k,t])=>t.espn).map(([k,t])=>[k,t.espn])))}
  LIVE=FX.some(f=>f.state==="in");
  ico.classList.remove("spin");
  renderAll();
  if(manual) toast(ok?"Updated":"No connection — showing saved data");
}
function syncUI(){
  const d=$("#syncDot"),t=$("#syncTxt");
  if(LIVE){d.className="dot live";t.textContent="LIVE";return}
  if(SYNC){d.className="dot ok";const m=Math.round((Date.now()-SYNC)/6e4);t.textContent=m<1?"Updated now":m<60?`${m}m ago`:m<1440?`${Math.round(m/60)}h ago`:`${Math.round(m/1440)}d ago`}
  else{d.className="dot off";t.textContent="Offline data"}
}

     <div class="dt"><b>${new Date(f.iso).getDate()}</b><span>${fmtD(f.iso,{weekday:"short"}).toUpperCase()}</span></div>${mono(f.k,40)}
     <div class="nm">${f.ha==="H"?"v":"@"} ${T[f.k].n}<small>${f.comp==="SA"?"Serie A"+(f.md?" · MD"+f.md:""):compName[f.comp]}${f.res||f.tbc?"":" · "+fmtT(f.iso)}</small></div>
     ${f.res?`<div class="res ${live?"L":o}" style="${live?"background:var(--L)":""}">${live?"● ":""}${f.res[0]}–${f.res[1]}</div>`:thr(T[f.k].th||3)}</div>`;
  });
  $("#v-season").innerHTML=html;
  const n=$("#v-season .row.next");if(n&&!renderSeason._done){renderSeason._done=1;setTimeout(()=>n.scrollIntoView({block:"center"}),50)}
}

function renderTable(){
  if(!TABLE?.rows?.length){$("#v-table").innerHTML=`<div class="card empty"><b>Table loads online</b>Open with internet and tap the sync button.</div>`;return}
  const n=TABLE.rows.length;
  $("#v-table").innerHTML=`<div class="card" style="padding:8px 10px"><table class="tbl"><tr><th>#</th><th style="text-align:left">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
   ${TABLE.rows.map((x,i)=>`<tr class="${x.k==="roma"?"me":""} ${i<4?"cl":i<6?"el":i>=n-3?"rel":""}" onclick="${x.k==="roma"?"":`openDossier('${x.k}')`}"><td>${x.r??i+1}</td><td class="tm">${mono(x.k,24)}${T[x.k].n}</td><td>${x.p??""}</td><td>${x.w??""}</td><td>${x.d??""}</td><td>${x.l??""}</td><td>${x.gd>0?"+":""}${x.gd??""}</td><td class="pts">${x.pts??""}</td></tr>`).join("")}</table></div>
   <div class="legend" style="margin-top:12px"><span><i style="background:var(--ucl)"></i>Champions League</span><span><i style="background:#e88b2a"></i>Europe</span><span><i style="background:var(--L)"></i>Relegation</span></div>`;
}

function renderScout(){
  const seen=new Set();const opp=[];FX.forEach(f=>{if(!seen.has(f.k)){seen.add(f.k);opp.push(f)}});
  const nx=nextFx();
  const card=k=>{const f=FX.filter(x=>x.k===k);const nextOne=f.find(x=>!x.res);return `<div class="gc" onclick="openDossier('${k}')">${mono(k,50)}<div class="o">${T[k].n}</div>${thr(T[k].th||3)}<small>${nextOne?fmtD(nextOne.iso,{month:"short",day:"numeric"}):f.map(x=>`${x.res[0]}–${x.res[1]}`).join(" · ")}</small></div>`};
  const sa=opp.filter(f=>f.comp==="SA").map(f=>f.k),eu=opp.filter(f=>f.comp!=="SA").map(f=>f.k).filter(k=>!sa.includes(k));
  $("#v-scout").innerHTML=`${nx?`<div class="sec" style="margin-top:4px">Next up</div><div class="row c-${nx.comp}" onclick="openDossier('${nx.k}','${nx.id}')" style="grid-template-columns:52px 1fr auto">${mono(nx.k,52)}<div class="nm" style="font-size:18px">${T[nx.k].n}<small>${T[nx.k].coach||"Coach TBC"} · ${T[nx.k].shape||"Shape TBC"}</small></div><span class="pill p-H">Scout ›</span></div>`:""}
   <div class="sec">Serie A</div><div class="grid">${sa.map(card).join("")}</div>
   <div class="sec">Europe & cups</div><div class="grid">${eu.map(card).join("")}</div>`;
}

/* ===================================================================
   DOSSIER SHEET
   =================================================================== */
let CUR=null;
async function openDossier(k,fid){
  CUR=k;const t=T[k];const fx=FX.filter(f=>f.k===k);const focusF=fid?FX.find(f=>f.id===fid):fx.find(f=>!f.res)||fx[fx.length-1];
  const row=TABLE?.rows?.find(x=>x.k===k);
  const notes=store.get("notes",{})[k]||"";
  const shape=t.shape;
  $("#sheet").innerHTML=`<div class="sh-top"><div class="wrap"><span class="pill p-${focusF?.comp||"SA"}">${compName[focusF?.comp||"SA"]}</span><button class="close" onclick="closeSheet()">×</button></div></div>
  <div class="wrap">
   <div class="dhero" style="background:linear-gradient(140deg,${t.c[0]}cc,#1a1213 75%)">
     <div class="row2">${mono(k,76)}<div style="flex:1"><h2>${t.n}</h2>
       <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.8);margin-top:6px">${t.coach||"Coach TBC"} · ${shape||"Shape TBC"}</div>
       <div class="meter">${[1,2,3,4,5].map(i=>`<i class="${i<=(t.th||3)?"on":""}"></i>`).join("")}</div></div></div>
   </div>
   ${focusF?`<div class="sec">${focusF.res?"Result":"Match"}</div>${matchCard(focusF)}`:""}
   <div class="sec">Their numbers</div>
   <div class="tiles">${row?`<div class="tile"><b class="g">${ordinal(row.r)}</b><span>Position</span></div><div class="tile"><b>${row.pts}</b><span>Points</span></div><div class="tile"><b>${row.gf}–${row.ga}</b><span>Goals</span></div><div class="tile"><b>${row.w}-${row.d}-${row.l}</b><span>W-D-L</span></div>`
     :`<div class="tile" style="grid-column:1/-1"><b style="font-size:15px">${focusF?.comp==="SA"?"Loads with the live table":"Not in the Serie A table"}</b></div>`}</div>
   <div class="sec">Their last 5</div><div class="card" id="oppForm"><div class="form">${[0,1,2,3,4].map(()=>`<div class="fchip N">·</div>`).join("")}</div></div>
   ${shape&&SH[shape]?`<div class="sec">Matchup v our 3-4-2-1</div><div class="pitchbox">${pitch(shape)}</div>
     <div class="legend"><span><i style="background:${PC.roma};border:1px solid ${PC.gold}"></i>Roma</span><span><i style="background:${PC.opp}"></i>${t.n} ${shape}</span></div>
     <div class="sec">Game plan</div><div class="keys">${PLAN[shape].keys.map((x,i)=>`<div class="key"><div class="n">${i+1}</div><b>${x}</b></div>`).join("")}</div>`
     :`<div class="sec">Matchup</div><div class="card empty"><b>Shape TBC</b>Add it once you've watched them.</div>`}
   ${t.pl?`<div class="sec">Danger men</div><div class="plist">${t.pl.map(p=>`<span>${p}</span>`).join("")}</div>`:""}
   ${fx.length?`<div class="sec">This season v ${t.n}</div><div>${fx.map(f=>`<div class="row c-${f.comp}" style="grid-template-columns:44px 1fr auto" onclick="openDossier('${k}','${f.id}')"><div class="dt"><b>${new Date(f.iso).getDate()}</b><span>${fmtD(f.iso,{month:"short"}).toUpperCase()}</span></div><div class="nm">${f.ha==="H"?"Home":"Away"}<small>${compName[f.comp]}</small></div>${f.res?`<div class="res ${outcome(f.res)}">${f.res[0]}–${f.res[1]}</div>`:`<span class="pill p-A">${fmtD(f.iso,{month:"short",day:"numeric"})}</span>`}</div>`).join("")}</div>`:""}
   <div class="sec">Scout notes</div>
   <textarea id="notes" placeholder="Shape, danger men, set pieces, pressing triggers…">${esc(notes)}</textarea>
   <div class="note">Saved on this phone</div>
  </div>`;
  $("#sheet").classList.add("on");$("#sheet").scrollTop=0;document.body.style.overflow="hidden";
  $("#notes").oninput=e=>{const n=store.get("notes",{});n[k]=e.target.value;store.set("notes",n)};
  loadOppForm(k);
}
function matchCard(f){
  const home=f.ha==="H",L=home?"roma":f.k,R=home?f.k:"roma";
  const sc=f.res?(home?`${f.res[0]}–${f.res[1]}`:`${f.res[1]}–${f.res[0]}`):"VS";
  const past=new Date(f.iso)<Date.now()&&f.state!=="in";
  return `<div class="card"><div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center">
   <div>${mono(L,48)}<div style="font:700 13px Oswald,Impact,sans-serif;text-transform:uppercase;margin-top:6px">${T[L].n}</div></div>
   <div style="font:700 ${f.res?36:22}px Oswald,Impact,sans-serif;${f.res?"":"color:var(--mute)"}">${sc}</div>
   <div>${mono(R,48)}<div style="font:700 13px Oswald,Impact,sans-serif;text-transform:uppercase;margin-top:6px">${T[R].n}</div></div></div>
   <div class="note" style="font-size:12.5px;font-weight:700">${fmtD(f.iso,{weekday:"short",month:"short",day:"numeric"})}${f.tbc?" · time TBC":" · "+fmtT(f.iso)}${f.manual?" · entered manually":""}</div>
   ${past&&f.src!=="live"?`<div class="scorebox" style="margin-top:12px"><input id="sR" inputmode="numeric" value="${f.res?f.res[0]:""}" placeholder="Roma"><b style="font:700 22px Oswald,Impact,sans-serif">–</b><input id="sO" inputmode="numeric" value="${f.res?f.res[1]:""}" placeholder="${T[f.k].n.slice(0,3)}"><button class="btn" onclick="saveScore('${f.id}')">Save</button></div><div class="note">No live data for this one yet — enter Roma's score first</div>`:""}
  </div>`;
}
function saveScore(id){const a=parseInt($("#sR").value),b=parseInt($("#sO").value);if(isNaN(a)||isNaN(b))return toast("Enter both scores");
  const m=store.get("manual",{});m[id]=[a,b];store.set("manual",m);loadFixtures();renderAll();openDossier(CUR,id);toast("Result saved")}
async function loadOppForm(k){
  const el=$("#oppForm");const t=T[k];
  // 1) Our results vs league from FX can't show their form; use ESPN team schedule
  const cache=store.get("form_"+k,null);
  const draw=list=>{if(!el||CUR!==k)return;el.innerHTML=list.length?`<div style="display:flex;gap:8px;overflow-x:auto">${list.map(x=>`<div style="text-align:center;flex:none"><div class="fchip ${x.o}" style="margin:0 auto">${x.o}</div><div style="font-size:10.5px;color:var(--mute);font-weight:700;margin-top:5px;max-width:58px;line-height:1.15">${x.s}<br>${esc(x.v)}</div></div>`).join("")}</div>`
    :`<div class="note" style="margin:0">Live form loads when online</div>`};
  if(cache) draw(cache.list);
  const ids=store.get("espnIds",{});const id=t.espn||ids[k];
  if(!id||(cache&&Date.now()-cache.at<3*3600e3)){if(!cache)draw([]);return}
  const lgs=SA.some(f=>f[0]===k)?["ita.1"]:["uefa.champions"];
  let evs=[];
  for(const lg of lgs){try{const j=await getJSON(`${API}${lg}/teams/${id}/schedule`);(j.events||[]).forEach(e=>{const c=e.competitions?.[0];const st=(c?.status||e.status)?.type;if(!st?.completed)return;
     const cs=c.competitors||[];const me=cs.find(x=>String(x.team?.id)===String(id));const op=cs.find(x=>x!==me);if(!me||!op)return;const a=scoreOf(me),b=scoreOf(op);if(a==null||b==null)return;
     evs.push({d:e.date,o:a>b?"W":a<b?"L":"D",s:`${a}–${b}`,v:(op.team?.abbreviation||op.team?.shortDisplayName||"")})})}catch(e){}}
  evs.sort((a,b)=>a.d.localeCompare(b.d));const list=evs.slice(-5);
  if(list.length){store.set("form_"+k,{at:Date.now(),list})} draw(list.length?list:(cache?.list||[]));
}
function closeSheet(){$("#sheet").classList.remove("on");document.body.style.overflow="";CUR=null}

/* ===================================================================
   NAV + BOOT
   =================================================================== */
let VIEW="home";
function nav(v){VIEW=v;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.v===v));document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));window.scrollTo(0,0);if(v==="season"){renderSeason._done=0;renderSeason()}}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>nav(b.dataset.v));
function renderAll(){syncUI();renderHome();renderSeason();renderTable();renderScout()}
(function boot(){
  const ids=store.get("espnIds",{});Object.entries(ids).forEach(([k,v])=>{if(T[k])T[k].espn=v});
  loadFixtures();renderAll();refresh(false);
  setInterval(tickCD,1000);
  setInterval(()=>{syncUI();if(LIVE||(nextFx()&&Math.abs(new Date(nextFx().iso)-Date.now())<3*3600e3))refresh(false)},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(!SYNC||Date.now()-SYNC>10*6e4))refresh(false)});
})();
</script>
</body>
